<!DOCTYPE html>
<html>
<body>
<canvas id="c"></canvas>
<script>
async function process() {
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = "media_1786889213366.jpg";
  await new Promise(r => img.onload = r);
  
  const canvas = document.getElementById('c');
  canvas.width = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imgData.data;
  
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i];
    const g = data[i+1];
    const b = data[i+2];
    
    // The feather is electric blue: high Blue (b > 150), and b > r * 1.3, b > g * 1.1
    // The checkerboard background consists of white (255,255,255) and light gray (220-240, 220-240, 220-240) where r,g,b are close to each other.
    const isBlue = (b > 130 && b > r + 30 && b > g + 15);
    
    if (!isBlue) {
      data[i+3] = 0; // Transparent
    } else {
      // Clean pure electric blue: normalize to #1677FF (22, 119, 255) with alpha smoothing
      // Keep blue feather intact
    }
  }
  
  ctx.putImageData(imgData, 0, 0);
  const dataUrl = canvas.toDataURL('image/png');
  
  // Save or output
  const res = await fetch('/save-logo', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dataUrl })
  });
}
</script>
</body>
</html>
